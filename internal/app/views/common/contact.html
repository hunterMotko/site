{{ block "contact" . }}
<!-- A stated ask, not three unlabelled icons. The previous version offered a
     mailto: behind an image whose alt text read "LinkedIn Icon", which is both
     the weakest possible call to action and wrong. -->
<footer class="contact" id="contact">
  <h2 class="section-title">Get in touch</h2>
  <p class="contact-ask">
    Open to remote platform, backend, and data engineering work with teams
    anywhere in the US — contract or full-time.
  </p>
  <ul class="contact-links">
    <li><a href="mailto:huntermotko.dev@gmail.com">huntermotko.dev@gmail.com</a></li>
    <li><a target="_blank" rel="noopener" href="https://github.com/hunterMotko">GitHub</a></li>
    <li><a target="_blank" rel="noopener" href="https://linkedin.com/in/hunter-motko">LinkedIn</a></li>
    {{ if .HasResume }}<li><a href="/resume.pdf">Résumé (PDF)</a></li>{{ end }}
  </ul>
</footer>
{{ end }}
