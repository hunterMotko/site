{{ block "main" . }}
<main class="main" id="main">
  <img class="headshot" src="/images/headshot.jpeg" alt="Hunter Motko" height="300" width="300" />
  <div class="inner-container">
    <h1 class="name-title">Hunter Motko</h1>
    <!-- The positioning line leads, not a job title. Previously this page was a
         headshot and a tagline with nothing to click, so the strongest content
         on the site sat one navigation step away from anyone who landed here. -->
    <h2 class="position-title">{{ .Positioning }}</h2>
    <p class="position-sub">{{ .Focus }}</p>

    {{ with index .Proof 0 }}
    <p class="home-proof">{{ .Claim }}.</p>
    {{ end }}

    <div class="cta-row">
      <a class="cta cta-primary" href="/work">See the work</a>
      <a class="cta" href="/about">About me</a>
    </div>

    <div class="socials">
      <a class="icon" target="_blank" rel="noopener" href="https://github.com/hunterMotko">
        <img src="/images/github.svg" alt="GitHub" height="40" width="40">
      </a>
      <a class="icon" target="_blank" rel="noopener" href="https://linkedin.com/in/hunter-motko">
        <img src="/images/linkedin.png" alt="LinkedIn" height="40" width="40">
      </a>
      <a class="icon" href="mailto:huntermotko.dev@gmail.com">
        <img src="/images/mail.svg" alt="Email" height="50" width="50">
      </a>
    </div>
  </div>
</main>
{{ end }}
